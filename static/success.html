<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Taxova.ai — You're live</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap" rel="stylesheet"/>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: "#070B12",
              "surface-container-lowest": "#121A24",
              "outline-variant": "#2A3848",
              "on-surface": "#F2F5F8",
              "on-surface-variant": "#8B9BB0",
              primary: "#36D6AE",
              "on-primary": "#04281F",
              "primary-container": "#36D6AE",
              secondary: "#2BB896",
              "secondary-container": "#0E5544",
              "surface-variant": "#182230",
            },
            spacing: {
              "onboarding-card-width": "480px",
              "margin-mobile": "16px",
              gutter: "24px",
            },
            fontFamily: {
              "body-md": ["Sora"],
              "headline-lg": ["Sora"],
              "headline-lg-mobile": ["Sora"],
              "label-md": ["Sora"],
            },
            fontSize: {
              "body-md": ["16px", { lineHeight: "24px" }],
              "headline-lg": ["28px", { lineHeight: "36px", fontWeight: "700" }],
              "headline-lg-mobile": ["24px", { lineHeight: "32px", fontWeight: "700" }],
              "label-md": ["14px", { lineHeight: "20px", fontWeight: "600" }],
            },
          },
        },
      };
    </script>
    <style>
        body {
            background:
              radial-gradient(ellipse 80% 50% at 50% -10%, rgba(54,214,174,0.14), transparent 55%),
              #070B12;
            font-family: Sora, system-ui, sans-serif;
        }
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
        }
        .confetti {
            position: fixed;
            top: -10px;
            z-index: 10;
            animation: fall linear forwards;
        }
        .material-symbols-outlined { font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24; }
    </style>
</head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col font-body-md text-body-md overflow-hidden">
    <div class="fixed top-0 left-0 w-full h-1 bg-surface-variant z-50">
        <div class="h-full bg-primary w-full"></div>
    </div>
    <main class="flex-grow flex items-center justify-center px-margin-mobile md:px-gutter relative z-20">
        <div class="absolute inset-0 pointer-events-none" id="confetti-container"></div>
        <div class="bg-surface-container-lowest border border-outline-variant rounded-xl p-8 md:p-12 max-w-onboarding-card-width w-full flex flex-col items-center text-center shadow-xl shadow-black/30 relative overflow-hidden">
            <img src="/static/logo.png?v=4" alt="Taxova.ai" class="h-16 w-auto max-w-[300px] object-contain mb-5"/>
            <div class="mb-6 bg-secondary-container rounded-full p-4">
                <span class="material-symbols-outlined text-[48px] text-secondary" style="font-variation-settings: 'FILL' 1;">check_circle</span>
            </div>
            <h1 class="text-headline-lg-mobile md:text-headline-lg text-on-surface mb-4">You're live</h1>
            <p class="text-body-md text-on-surface-variant mb-8">
                Taxova.ai is ready. Send an invoice photo on WhatsApp, then review it in the CA dashboard.
            </p>
            <a href="/dashboard" class="bg-primary hover:brightness-110 text-on-primary text-label-md font-label-md py-3 px-6 rounded-lg w-full transition text-center flex items-center justify-center gap-2">
                Go to Dashboard
                <span class="material-symbols-outlined text-[18px]">arrow_forward</span>
            </a>
            <a href="/privacy" class="mt-4 text-sm text-on-surface-variant hover:text-primary transition">Privacy Policy</a>
        </div>
    </main>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('confetti-container');
            const colors = ['#36D6AE', '#2BB896', '#F0B35A', '#7BE8C8'];
            for (let i = 0; i < 40; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                const width = Math.random() * 8 + 4;
                const height = Math.random() * 16 + 8;
                confetti.style.width = `${width}px`;
                confetti.style.height = `${height}px`;
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                confetti.style.animationDuration = `${Math.random() * 3 + 2.5}s`;
                confetti.style.animationDelay = `${Math.random() * 2}s`;
                if (Math.random() > 0.5) confetti.style.borderRadius = '50%';
                container.appendChild(confetti);
            }
        });
    </script>
</body>
</html>
